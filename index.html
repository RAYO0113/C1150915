<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>瑞媛的國文教學｜網站已搬家</title>
<!-- 2026-10-07：舊站停用（最後版本 V112，見 git 歷史）。本頁刻意不放任何程式，不讀寫瀏覽器資料、不觸發雲端同步。 -->
<style>
  :root { --ink:#1f3036; --muted:#5a6f75; --qing:#22495a; --mist:#eef4f2; --paper:#ffffff; --line:#c9d9d4; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e4eeeb; --muted:#9fb4b6; --qing:#a6d0dd; --mist:#141c1e; --paper:#1d2729; --line:#34474a; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { display:flex; align-items:center; justify-content:center; padding:16px; background:var(--mist); color:var(--ink);
    font-family:"Noto Serif TC","PMingLiU","Songti TC",serif; }
  main { width:100%; max-width:440px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:36px 24px; text-align:center; }
  h1 { margin:0 0 12px; font-size:26px; letter-spacing:4px; color:var(--qing); }
  p { margin:0; font-size:19px; line-height:1.8; }
  small { display:block; margin-top:18px; color:var(--muted); font-size:13px; font-family:sans-serif; }
</style>
</head>
<body>
<main>
  <h1>網站已搬家</h1>
  <p>請洽瑞媛</p>
  <small>瑞媛的國文教學</small>
</main>
</body>
</html>
